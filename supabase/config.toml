project_id = "it-inventory"
[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.migrations]
enabled = true
schema_paths = []
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[realtime]
enabled = false
[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
[local_smtp]
enabled = true
port = 54324
[storage]
enabled = true
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirm", "http://localhost:3000/set-password", "http://127.0.0.1:3000/auth/confirm"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12
# Local-only captured email allowance supports repeatable invitation/recovery tests.
[auth.rate_limit]
email_sent = 100
[auth.email]
# This enables the email provider. The global auth.enable_signup=false still blocks registration.
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
[auth.email.template.invite]
subject = "IT Inventory invitation"
content_path = "./supabase/templates/invite.html"
[auth.email.template.recovery]
subject = "Reset your IT Inventory password"
content_path = "./supabase/templates/recovery.html"
[analytics]
enabled = false

[remotes.staging]
project_id = "ileoembzjxwhxgtiypec"

[remotes.staging.db.seed]
enabled = false
