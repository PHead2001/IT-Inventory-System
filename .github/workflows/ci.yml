name: Foundation CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  reuse_evidence:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, it-inventory-light]
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      reuse: ${{ steps.evidence.outputs.reuse }}
      evidence: ${{ steps.evidence.outputs.evidence }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - id: evidence
        run: node scripts/ci-reuse.mjs
        env:
          GH_TOKEN: ${{ github.token }}
  required:
    needs: [reuse_evidence]
    if: ${{ always() && !cancelled() }}
    runs-on:
      - self-hosted
      - ${{ needs.reuse_evidence.result == 'success' && needs.reuse_evidence.outputs.reuse == 'true' && 'it-inventory-light' || 'it-inventory-heavy' }}
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        id: node_setup
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Reverify matching PR validation
        id: recheck
        if: needs.reuse_evidence.outputs.reuse == 'true'
        run: node scripts/ci-reuse.mjs --reverify
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_EVIDENCE: ${{ needs.reuse_evidence.outputs.evidence }}
      - name: Set up pinned npm
        id: npm_setup
        if: needs.reuse_evidence.outputs.reuse != 'true'
        run: |
          if ! runner_npm_version="$(npm --version)" || [ "$runner_npm_version" != "11.11.0" ]; then
            npm install --global npm@11.11.0
          fi
      - name: Install locked dependencies
        id: install
        if: needs.reuse_evidence.outputs.reuse != 'true'
        run: npm ci --prefer-offline
      - name: Verify tested revision
        id: revision
        if: needs.reuse_evidence.outputs.reuse != 'true'
        run: test "$(git rev-parse HEAD)" = "$TESTED_SHA"
      - name: Inspect workflow source for future reuse
        id: workflow_source_inspection
        if: needs.reuse_evidence.outputs.reuse != 'true'
        continue-on-error: true
        run: node scripts/ci-reuse.mjs --workflow-source
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify executed workflow ${{ github.workflow_sha }}
        id: workflow_source
        if: needs.reuse_evidence.outputs.reuse != 'true' && steps.workflow_source_inspection.outcome == 'success' && steps.workflow_source_inspection.outputs.verified == 'true'
        run: echo 'Executed workflow source verified.'
      - name: Validate application
        id: app
        if: needs.reuse_evidence.outputs.reuse != 'true'
        run: npm run validate:app
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:1
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: offline-build-placeholder
          APP_ORIGIN: http://localhost:3000
          APP_ENV: ci
      - name: Start disposable database
        id: db_start
        if: needs.reuse_evidence.outputs.reuse != 'true'
        run: npm run db:start
      - name: Reset disposable database
        id: db_reset
        if: needs.reuse_evidence.outputs.reuse != 'true'
        run: npm run db:reset
      - name: Validate database
        id: db_tests
        if: needs.reuse_evidence.outputs.reuse != 'true'
        run: npm run test:db
      - name: Verify database types
        id: db_types
        if: needs.reuse_evidence.outputs.reuse != 'true'
        run: npm run db:types:check
      - name: Prepare browser
        id: browser_install
        if: needs.reuse_evidence.outputs.reuse != 'true'
        run: node scripts/install-ci-browser.mjs
      - name: Validate browser workflows
        id: e2e
        if: needs.reuse_evidence.outputs.reuse != 'true'
        run: npm run test:e2e
      - name: Stop disposable database
        id: db_stop
        if: ${{ always() && needs.reuse_evidence.outputs.reuse != 'true' }}
        run: npm run db:stop
      - name: Require every foundation gate
        id: full_completion
        if: ${{ always() && needs.reuse_evidence.outputs.reuse != 'true' }}
        run: node scripts/ci-gates.mjs
        env:
          FOUNDATION_CHECKOUT: ${{ steps.checkout.outcome }}
          FOUNDATION_NODE_SETUP: ${{ steps.node_setup.outcome }}
          FOUNDATION_NPM_SETUP: ${{ steps.npm_setup.outcome }}
          FOUNDATION_INSTALL: ${{ steps.install.outcome }}
          FOUNDATION_REVISION: ${{ steps.revision.outcome }}
          FOUNDATION_APP: ${{ steps.app.outcome }}
          FOUNDATION_DB_START: ${{ steps.db_start.outcome }}
          FOUNDATION_DB_RESET: ${{ steps.db_reset.outcome }}
          FOUNDATION_DB_TESTS: ${{ steps.db_tests.outcome }}
          FOUNDATION_DB_TYPES: ${{ steps.db_types.outcome }}
          FOUNDATION_BROWSER_INSTALL: ${{ steps.browser_install.outcome }}
          FOUNDATION_E2E: ${{ steps.e2e.outcome }}
          FOUNDATION_DB_STOP: ${{ steps.db_stop.outcome }}
      - name: Require validation decision
        if: always()
        run: node scripts/ci-required.mjs
        env:
          EVIDENCE_RESULT: ${{ needs.reuse_evidence.result }}
          REUSE: ${{ needs.reuse_evidence.outputs.reuse }}
          CHECKOUT_RESULT: ${{ steps.checkout.outcome }}
          NODE_RESULT: ${{ steps.node_setup.outcome }}
          FULL_RESULT: ${{ steps.full_completion.outcome }}
          RECHECK_RESULT: ${{ steps.recheck.outcome }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: failure_artifact
        if: failure() || cancelled()
        continue-on-error: true
        with:
          name: foundation-failures-${{ env.TESTED_SHA }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
      - name: Warn when failure diagnostics cannot be uploaded
        if: ${{ always() && steps.failure_artifact.outcome == 'failure' }}
        run: |
          echo '::warning::Failure diagnostics could not be uploaded; no downloadable trace is available from this upload. Inspect Validate browser workflows logs and the bounded Browser failure metadata summary, when Playwright reached its reporter. Test failures remain failures.'
          echo 'Failure artifact upload failed. GitHub storage quota or service availability may prevent retrieval. No downloadable trace is available from this upload; use the browser validation log and bounded failure metadata above if emitted. If the process terminated before the reporter finished, metadata may also be absent.' >> "$GITHUB_STEP_SUMMARY"
  production_database:
    name: ${{ github.event_name == 'push' && 'Production database ready' || 'Production database inactive (PR)' }}
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [required]
    runs-on: [self-hosted, it-inventory-light]
    timeout-minutes: 15
    environment: production-database
    steps:
      - name: Require successful main tests
        env:
          REQUIRED_RESULT: ${{ needs.required.result }}
        run: test "$REQUIRED_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: |
          if ! runner_npm_version="$(npm --version)" || [ "$runner_npm_version" != "11.11.0" ]; then
            npm install --global npm@11.11.0
          fi
      - run: npm ci --prefer-offline
      - run: npm run db:deliver:production
        env:
          ENABLE_PRODUCTION_DB_DELIVERY: ${{ vars.ENABLE_PRODUCTION_DB_DELIVERY }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
