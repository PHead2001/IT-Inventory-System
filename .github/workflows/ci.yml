name: Foundation CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:1
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: offline-build-placeholder
      APP_ORIGIN: http://localhost:3000
      APP_ENV: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.11.0
      - run: npm ci
      - run: git rev-parse HEAD
      - run: npm run validate:app
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.11.0
      - run: npm ci
      - run: git rev-parse HEAD
      - run: npm run db:start
      - run: npm run db:reset
      - id: database_tests
        run: npm run test:db
      - run: npm run db:types:check
      - if: ${{ !cancelled() && steps.database_tests.outcome == 'success' }}
        run: npx playwright install --with-deps chromium
      - if: ${{ !cancelled() && steps.database_tests.outcome == 'success' }}
        run: npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: foundation-failures-${{ env.TESTED_SHA }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
      - if: always()
        run: npm run db:stop
  required:
    if: always()
    needs: [app, database]
    runs-on: ubuntu-latest
    steps:
      - name: Require all foundation gates
        env:
          APP_RESULT: ${{ needs.app.result }}
          DATABASE_RESULT: ${{ needs.database.result }}
        run: |
          echo "Tested SHA: $TESTED_SHA"
          test "$APP_RESULT" = success
          test "$DATABASE_RESULT" = success
  production_database:
    name: ${{ github.event_name == 'push' && 'Production database ready' || 'Production database inactive (PR)' }}
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [required]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-database
    steps:
      - name: Require successful main tests
        env:
          REQUIRED_RESULT: ${{ needs.required.result }}
        run: test "$REQUIRED_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.11.0
      - run: npm ci
      - run: npm run db:deliver:production
        env:
          ENABLE_PRODUCTION_DB_DELIVERY: ${{ vars.ENABLE_PRODUCTION_DB_DELIVERY }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
