name: Preview staff access
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open, same-repository PR number to reconcile
        required: true
        type: number
  schedule:
    - cron: '*/30 * * * *'
permissions:
  contents: read
  pull-requests: read
  checks: read
jobs:
  discover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
      count: ${{ steps.targets.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - id: targets
        run: node scripts/preview-access-discover.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
  provision:
    needs: discover
    if: github.ref == 'refs/heads/main' && needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: preview-access
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        pr: ${{ fromJSON(needs.discover.outputs.targets) }}
    concurrency:
      group: preview-staff-access-${{ matrix.pr }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Reconcile isolated preview staff account
        run: node scripts/preview-access.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW_SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.PREVIEW_SUPABASE_MANAGEMENT_TOKEN }}
          PREVIEW_STAFF_PASSWORD: ${{ secrets.PREVIEW_STAFF_PASSWORD }}
          PREVIEW_ALLOW_SIX_DIGIT_MINIMUM: ${{ vars.PREVIEW_ALLOW_SIX_DIGIT_MINIMUM }}
          PREVIEW_TARGET_PR: ${{ matrix.pr }}
