name: Preview staff access
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open, same-repository PR number to reconcile
        required: true
        type: number
permissions:
  contents: read
  pull-requests: read
  checks: read
concurrency:
  group: preview-staff-access-workflow-${{ github.ref }}-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false
jobs:
  provision:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, it-inventory-light]
    timeout-minutes: 15
    environment: preview-access
    concurrency:
      group: preview-staff-access-${{ github.event.pull_request.number || inputs.pr_number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Reconcile isolated preview staff account
        run: node scripts/preview-access.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW_SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.PREVIEW_SUPABASE_MANAGEMENT_TOKEN }}
          PREVIEW_STAFF_PASSWORD: ${{ secrets.PREVIEW_STAFF_PASSWORD }}
          PREVIEW_ALLOW_SIX_DIGIT_MINIMUM: ${{ vars.PREVIEW_ALLOW_SIX_DIGIT_MINIMUM }}
          PREVIEW_VERCEL_TOKEN: ${{ secrets.PREVIEW_VERCEL_TOKEN }}
          PREVIEW_VERCEL_PROJECT_ID: ${{ vars.PREVIEW_VERCEL_PROJECT_ID }}
          PREVIEW_VERCEL_TEAM_ID: ${{ vars.PREVIEW_VERCEL_TEAM_ID }}
          PREVIEW_TARGET_PR: ${{ github.event.pull_request.number || inputs.pr_number }}
